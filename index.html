<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub | Login</title>
  <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
  
  <!-- daisyUI + tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 md:p-8 rounded-xl shadow-md w-full max-w-md">

    <img src="assets/github-logo.png" alt="GitHub Logo" class="w-20 md:w-24 mx-auto mb-4">
    
    <h2 class="text-xl md:text-2xl font-bold text-center mb-2">
      GitHub Issues Tracker
    </h2>

    <p class="text-center text-gray-500 text-sm md:text-base mb-6">
      Sign in to manage your issues
    </p>

    <!-- Username -->
    <label class="font-medium block mb-2" for="user-input">Username</label>
    <input 
      id="user-input" 
      type="text" 
      placeholder="Enter Username" 
      class="w-full border border-gray-300 rounded-md p-2 mb-1"
    >
    <p class="text-blue-600 text-sm mb-4">Default: admin</p>

    <!-- Password -->
    <label class="font-medium block mb-2" for="password-input">Password</label>
    <input 
      id="password-input" 
      type="password" 
      placeholder="Enter Password" 
      class="w-full border border-gray-300 rounded-md p-2 mb-1"
    >
    <p class="text-blue-600 text-sm mb-4">Default: admin123</p>

    <!-- ✅ Button id ঠিক করেছি -->
    <button 
      id="login-btn" 
      class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700"
    >
      Sign In
    </button>

    <div class="flex items-center my-4">
      <div class="grow border-t border-gray-400"></div>
      <span class="mx-4 shrink text-gray-500 font-medium text-sm">OR</span>
      <div class="grow border-t border-gray-400"></div>
    </div>

    <p class="text-[#64748B] text-center mb-2 text-sm">Demo Credentials:</p>
    <div class="bg-[#F8FAFC] p-4 rounded-md text-center text-sm">
      <p><span class="font-bold">Username:</span> admin</p>
      <p><span class="font-bold">Password:</span> admin123</p>
    </div>

  </div>

  <!-- JavaScript link -->
  <script src="js/login.js"></script>

</body>

</html>
