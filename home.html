<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- daisyUI + talwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="navbar bg-base-100 shadow-sm justify-around mb-9">
                <div class="flex-1">
                    <div class="flex">
                        <img class="w-9" src="assets/github-logo.png" alt="">
                        <a class="btn btn-ghost text-xl">GitHub Issues Tracker</a>
                    </div>

                </div>
                <div class="flex gap-2">

                    <div class="relative">
                        <!-- Icon -->
                        <i
                            class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>

                        <!-- Input -->
                         
                        <input id="searchInput" type="text" placeholder="Search issues..."
                            class="w-full border border-gray-300 rounded-md p-2 pl-10">
                    </div>
                    <div>
                        <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button>
                    </div>
                </div>
            </div>
            </div>
        </nav>
    </header>

    <!-- main section -->

    <main class="w-[80%] mx-auto space-y-9">

        <!-- buttons tab  -->
        <div class="flex gap-4 p-5">

            <button id="allBtn" class="btn btn-primary filter-btn" onclick="filterIssues('all','allBtn')">
                All
            </button>

            <button id="openBtn" class="btn filter-btn" onclick="filterIssues('open','openBtn')">
                Open
            </button>

            <button id="closedBtn" class="btn filter-btn" onclick="filterIssues('closed','closedBtn')">
                Closed
            </button>

        </div>



        <section class="bg-base-100 shadow-md p-4">
            <div class="parrent flex justify-between">
                <div class="flex gap-2 items-center">
                    <div>
                        <img src="assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <p class="font-bold"> <span id="issueCount">50</span> Issues</p>
                        <p class="text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>


                <div class="flex gap-4">
                    <div class="flex items-center gap-2">
                        <img src="assets/Ellipse 2.png" alt="" class="w-4 h-4">
                        <p>Open</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <img src="assets/Ellipse 2 (1).png" alt="" class="w-4 h-4">
                        <p>Closed</p>
                    </div>
                </div>
            </div>

            <!-- issue card container -->
            <div id="issueContainer" class="grid grid-cols-4 gap-4 mt-6"></div>




        </section>

    </main>

    <!-- modal style from daisy UI -->
<dialog id="issueModal" class="modal">
  <div class="modal-box max-w-2xl">

    <!-- Title -->
    <h2 id="modalTitle" class="text-xl font-bold mb-2"></h2>

    <!-- Status + author + date -->
    <div class="flex items-center gap-3 text-sm mb-4">
      <span id="modalStatus" class="badge badge-success"></span>
      <span class="text-gray-500">
        Opened by <span id="modalAuthor"></span> • 
        <span id="modalDate"></span>
      </span>
    </div>

    <!-- Labels -->
    <div id="modalLabels" class="flex gap-2 mb-4 flex-wrap"></div>

    <!-- Description -->
    <p id="modalDescription" class="text-gray-600 mb-6"></p>

    <!-- Assignee + Priority -->
    <div class="flex justify-between mb-6">

      <div>
        <p class="text-sm text-gray-400">Assignee:</p>
        <p id="modalAssignee" class="font-semibold"></p>
      </div>

      <div>
        <p class="text-sm text-gray-400">Priority:</p>
        <span id="modalPriority" class="badge badge-error"></span>
      </div>

    </div>

    <!-- Close Button -->
    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-primary">Close</button>
      </form>
    </div>

  </div>
</dialog>

<!-- loding spinner -->
<div id="loadingSpinner" class="flex justify-center items-center py-20">
    <span class="loading loading-spinner loading-lg text-primary"></span>
</div>


<div id="issueContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    
</div>

    <!-- javascript link -->
    <script src="js/main.js"></script>
</body>

</html>
